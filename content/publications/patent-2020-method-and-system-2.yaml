  note: "58 patents, 2000-2021, verbatim from https://www.xlab-ub.com/publication/patents. Verification finding: source data's \"date\" field is ambiguous (not clearly filed vs. issued for older/China-patent entries) -- mapped to filedDate as a best guess wherever only a bare \"date\" key was given. Every explicit \"filed: ...\" key was mapped straight to filedDate, and every explicit \"issued: ...\" key straight to issuedDate; three entries give both and get both fields. One entry (\"Optimized Asset Maintenance and Replacement Schedule\") has no date/filed/issued field in the source at all -- its id year is inferred from its position in the list; it carries no filedDate/issuedDate since there's nothing to map. authors[].personId is only set for \"J. Xiong\" -> jinjun-xiong, the one author we can confidently match to a real content/people/ record from the initials alone. All other co-inventors are external (IBM/UB/other collaborator names) with no Person record -- left as name-only entries, not guessed at."
