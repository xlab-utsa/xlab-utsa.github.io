  note: 47 workshop papers, 2004-2021, verbatim from https://www.xlab-ub.com/publication/workshops. authors[].personId is only set for "J. Xiong" -> jinjun-xiong; all other co-authors are name-only. Source "award" fields (e.g. "Best Poster Award") are award info and are intentionally NOT copied into note -- that belongs on Recognition, out of scope here. Two pairs of same-titled entries below ("Statistical Ordering of Correlated Timing Quantities..." and "Statistical Multilayer Process Space Coverage for At-Speed Test") are flagged in the source as possible duplicates (NATW 2009 vs. ACM/IEEE Timing Issues, both May/Feb 2009) -- see SOURCE-NOTES.md item 3. Not resolved here; both kept as given, and the source's internal QA note text was not copied into Publication.note.
