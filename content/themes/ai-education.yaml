id: ai-education
title: AI + Education
shortDescription: AI that supports learning, teaching, and special education.
longDescription: We build AI for learners, educators, and the specialists who serve them, with a focus on children with speech and language needs. This work spans speech-language assessment and intervention tools, AI literacy and reading companions for young children, tools for parents and clinicians, and studies of how AI is used and perceived in classrooms and special education.
order: 1
