id: ai-algorithms
title: AI Algorithms
shortDescription: New models and learning theory across vision, language, and speech.
longDescription: Our algorithm research covers computer vision, natural language processing, and speech, together with the theory underneath them. It includes high-order and quadratic neural networks, physics-informed learning, generalization guarantees for training, neural architecture search, large language models, and the robustness and interpretability of learned models.
order: 2
